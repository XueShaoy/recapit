[transcription]
engine = "faster-whisper"
model = "turbo"
language = "zh"
device = "auto"
compute_type = "int8"

[transcription.chunking]
seconds = 900
overlap_seconds = 10

[transcription.decode]
beam_size = 5
vad_filter = true
hotwords = []

[output]
directory = "outputs"
timestamps = "paragraph"
paragraph_pause_seconds = 2.0
paragraph_max_chars = 240
